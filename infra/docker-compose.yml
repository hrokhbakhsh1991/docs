# Local dev stack — Postgres + Redis + MinIO (Phase 6.7 photos; see docs/phase-6/appendices/env-runtime-matrix.md)
# Postgres: `postgres` superuser + `app_tour` NOSUPERUSER app role (P4-E-RLS-01; matches CI phase-4-gate).
services:
  postgres:
    image: postgres:16
    container_name: app-tour-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_tour_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_tour_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../docs/phase-4/dev/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7
    container_name: app-tour-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: app-tour-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
