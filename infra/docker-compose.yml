# Phase 4 local stack — Postgres + Redis (see docs/phase-4-tenant-kernel.md §9.1)
services:
  postgres:
    image: postgres:16
    container_name: app-tour-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_tour_dev
      POSTGRES_USER: app_tour
      POSTGRES_PASSWORD: app_tour
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: app-tour-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
