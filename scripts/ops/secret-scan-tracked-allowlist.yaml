# Allowlist for scripts/ops/secret-scan-tracked-baseline.mjs
# Paths are repo-relative. Each entry needs a rationale (inventory honesty).
version: 1
entries:
  - path: legacy/apps/api/test/e2e/jwt-test-keys.ts
    rationale: Documented test-only PEM material for legacy e2e JWT
    families: [private_key]
  - path: apps/api/.env.local.example
    rationale: Example-only JWT placeholder/dev bootstrap slot; not an active credential
    families: [private_key]
  - path: infra/env/server.api.env.example
    rationale: Example-only JWT placeholder/dev bootstrap slot; not an active credential
    families: [private_key]
  - path: deploy/vps/env/api.env.example
    rationale: Example-only JWT placeholder/dev bootstrap slot; not an active credential
    families: [private_key]
  - path: apps/api/.env.example
    rationale: Example-only JWT placeholder/dev bootstrap slot; not an active credential
    families: [private_key]
  - path: apps/api/.env.development
    rationale: Historical local development JWT fixture file; absent from current tracked tree
    families: [private_key]
  - path_glob: "**/*.{spec,test}.ts"
    rationale: Fixtures may embed fake keys/tokens for unit tests
    families: [private_key, aws_access_key, github_pat, slack_token, stripe_live_key]
  - path_glob: "**/jwt-test-keys.ts"
    rationale: Shared JWT test key modules
    families: [private_key]
