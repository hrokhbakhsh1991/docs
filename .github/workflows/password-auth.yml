name: Password authentication regression

on:
  pull_request:
  push:
    branches: [dev]

concurrency:
  group: password-auth-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  password-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: codex_password_test_ci
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d codex_password_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5434/codex_password_test_ci
      DATABASE_URL_ADMIN: postgresql://postgres:postgres@127.0.0.1:5434/codex_password_test_ci
      PASSWORD_CREDENTIAL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5434/codex_password_test_ci
      PASSWORD_TEST_REDIS_URL: redis://127.0.0.1:6379
      PASSWORD_TEST_RLS_ROLE: app_tour
      NODE_ENV: test
      STORAGE_DRIVER: memory
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-platform
      - name: Create restricted database role
        run: psql "$DATABASE_URL_ADMIN" -f docs/phase-4/dev/init/01-app-role.sql
      - name: Apply migrations and generate the Prisma client
        run: |
          pnpm --filter @apps/api run db:migrate:deploy
          pnpm --filter @apps/api run prisma:generate
      - name: Build required workspace packages
        run: |
          bash scripts/ci/build-api-workspace-deps.sh
          pnpm --filter @app-tour/account-security-ui build
      - name: Test password services, replay protection, Postgres and Redis
        working-directory: apps/api
        run: >-
          pnpm exec node --import tsx --test --test-concurrency=1
          test/password-hash.spec.ts test/password-kdf-gate.spec.ts
          test/password-policy.spec.ts test/password-login.spec.ts
          test/password-management.spec.ts test/password-otp-scope.spec.ts
          test/password-credential-atomic.spec.ts test/password-credential-postgres.spec.ts
          test/password-rate-limit.spec.ts test/password-rate-limit-redis.spec.ts
      - name: Test portal BFF security
        run: pnpm --filter @apps/portal exec node --import tsx --test test/password-bff-security.spec.ts
      - name: Verify support sessions cannot change passwords
        run: pnpm --filter @apps/api run test:file test/platform-impersonate.spec.ts
      - name: Test admin BFF security
        run: pnpm --filter @apps/web exec node --import tsx --test test/password-bff-security.spec.ts
      - name: Test password interaction in both shared interfaces
        working-directory: apps/web
        env:
          TSX_TSCONFIG_PATH: ./test/tsconfig.react.json
        run: >-
          pnpm exec node --import ../../scripts/test/set-test-env.mjs --import tsx
          --import ./test/register-dom.mjs --test --test-force-exit --test-concurrency=1
          test/password-settings-ui.spec.tsx test/member-password-login-ui.spec.tsx
      - name: Test member transport and session client regressions
        run: |
          pnpm --filter @app-tour/tenant-kernel exec node --import tsx --test test/password-ingress-server.spec.ts
          pnpm --filter @app-tour/catalog-registration-flow-ui exec node --import tsx --test test/guest-auth-transport.spec.ts test/catalog-registration-auth-steps.spec.ts
          pnpm --filter @app-tour/session-client test

  portal-password-browser:
    name: Portal password browser flow
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      PASSWORD_AUTH_ENABLED: "true"
      PASSWORD_AUTH_CLIENT_IP_MODE: direct
      # Disposable CI-only keys for the isolated memory-driver environment.
      PASSWORD_AUTH_INGRESS_SECRET: "1111111111111111111111111111111111111111111111111111111111111111"
      PASSWORD_AUTH_RATE_LIMIT_SECRET: "2222222222222222222222222222222222222222222222222222222222222222"
      REDIS_URL: redis://127.0.0.1:6379
      SMOKE_PORTAL_BASE_URL: http://portal.operator.localhost:3003
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-platform
      - name: Build workspace dependencies
        run: |
          pnpm --filter @apps/api run prisma:generate
          bash scripts/ci/build-api-workspace-deps.sh
          pnpm --filter @app-tour/account-security-ui build
      - name: Install browser
        run: pnpm --filter @apps/portal exec playwright install --with-deps chromium
      - name: Exercise OTP registration, password creation and sign-in
        run: pnpm --filter @apps/portal exec playwright test -c playwright.password-auth.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: portal-password-browser-failure
          path: apps/portal/test-results/
          retention-days: 3
          if-no-files-found: ignore
