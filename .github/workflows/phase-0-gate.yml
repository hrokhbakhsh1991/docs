# Phase 0.5 — KS-01 gate split (see docs/phase-0-foundation.mdoc §9).
# Foundation-Gate is pure-contract-only; Integration-Gate is cross-phase-trunk-integrity.
# Phase 0 closure = packages/workspace-sdk/test/phase-0.contract.spec.ts (H-06).
# foundation-gate job: required for PR merge (branch protection job name).
# integration-gate: trunk integrity — full monorepo build/test + guards (REM-013).

name: phase-0-gate

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: phase-0-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-gate:
    name: Phase 0 foundation gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LEGACY_IMPORT_SCAN_SCOPE: foundation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Verify Node.js engine
        run: node scripts/guards/check-node-engine.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scope Assert
        run: node scripts/guards/foundation-scope-assert.mjs

      - name: Phase 0 foundation gate (Zero-Debt Covenant — H-06)
        run: pnpm run phase-0:foundation-gate

  integration-gate:
    name: Phase 0 integration gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # H-12 — full monorepo legacy-import depcruise (all packages/workspaces).
      LEGACY_IMPORT_SCAN_SCOPE: monorepo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Verify Node.js engine
        run: node scripts/guards/check-node-engine.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert checkout HEAD (REQ-P7-007 fail-fast)
        run: |
          echo "integration-gate HEAD=$(git rev-parse HEAD)"
          git merge-base --is-ancestor b046bdb "$(git rev-parse HEAD)" || {
            echo "::error::Stale checkout — need phase-7/entry-gate b046bdb+ (529bb2f tip). Do NOT Re-run bf6c9f4."
            exit 1
          }
          node scripts/verify-phase-7-genericity-proof-rev.mjs

      - name: Phase 0 integration gate (trunk integrity)
        run: pnpm run phase-0:integration-gate

      - name: Upload integration gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-0-integration-gate-report
          path: |
            reports/phase-0-integration-gate-*.json
            reports/phase-0-baseline-*.json
          if-no-files-found: ignore
