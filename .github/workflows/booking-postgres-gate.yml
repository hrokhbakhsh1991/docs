# Booking PostgreSQL certification — mandatory production-path proofs.
# Memory repositories are forbidden. Fast unit / memory HTTP suites stay outside this workflow.
#
# Docs: docs/phase-20/p7/appendices/BOOKING_CAPACITY_CONCURRENCY_CERT.md
# Branch protection: docs/phase-20/p7/appendices/BOOKING_BRANCH_PROTECTION_GATE.md
#
# PR velocity: do NOT use workflow-level pull_request.paths (required checks would pend).
# Instead: detect booking-related paths; run real jobs or same-name lightweight stubs.

name: booking-postgres-gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: booking-postgres-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://app_tour:app_tour@127.0.0.1:5434/tour_db?connection_limit=32
  DATABASE_URL_ADMIN: postgresql://postgres:postgres@127.0.0.1:5434/tour_db
  STORAGE_DRIVER: prisma
  NODE_ENV: test
  OUTBOX_RELAY_ENABLED: "false"
  PROJECTION_AUTO_RECONCILE_ENABLED: "false"

jobs:
  # Sets run_booking=true for push/main + workflow_dispatch; path-gated on pull_request only.
  booking-relevance:
    name: Booking relevance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_booking: ${{ steps.detect.outputs.run_booking }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Detect booking-related changes
        id: detect
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run_booking=true" >> "$GITHUB_OUTPUT"
            echo "event=${{ github.event_name }} — always run full Booking PostgreSQL proofs"
            exit 0
          fi

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "Diffing ${BASE_SHA}...${HEAD_SHA}"

          # Paths that affect capacity/HTTP booking proofs, RLS extras in this workflow,
          # migrate/bootstrap, or required-check drift guards.
          PATTERN='^(apps/api/src/bookings/|apps/api/src/bookings$|apps/api/test/booking|apps/api/test/bookings-|apps/api/src/outbox/|apps/api/src/workspace-finance/recon/|apps/api/test/tenant-rls-unprotected-tables\.postgres\.spec\.ts|apps/api/src/ops/branch-protection-verify-fail-closed\.spec\.ts|apps/api/prisma/|apps/api/scripts/db-migrate-deploy\.mjs|apps/api/scripts/.*migration|packages/booking-http-contracts/|packages/finance-core/|packages/finance-http/|packages/finance-http-contracts/|packages/workspace-sdk/|packages/platform-core/|infra/sql/|docs/phase-4/dev/init/01-app-role\.sql|scripts/ci/build-api-workspace-deps\.sh|scripts/ops/main-branch-required-checks\.mjs|scripts/ops/configure-main-branch-protection\.mjs|scripts/ops/verify-required-check-names\.mjs|\.github/workflows/booking-postgres-gate\.yml|package\.json|pnpm-lock\.yaml)'

          CHANGED="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" || true)"
          if printf '%s\n' "$CHANGED" | grep -E -q "$PATTERN"; then
            echo "run_booking=true" >> "$GITHUB_OUTPUT"
            echo "Booking-related paths changed — run full proofs"
            printf '%s\n' "$CHANGED" | grep -E "$PATTERN" || true
          else
            echo "run_booking=false" >> "$GITHUB_OUTPUT"
            echo "No booking-related paths — emit required-check stubs only"
          fi

  booking-postgres-capacity:
    name: Booking PostgreSQL capacity
    needs: booking-relevance
    if: needs.booking-relevance.outputs.run_booking == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tour_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tour_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Verify Node.js engine
        run: node scripts/guards/check-node-engine.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install CI OS packages
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Assert Prisma certification driver
        run: |
          test "$STORAGE_DRIVER" = "prisma"
          echo "STORAGE_DRIVER=$STORAGE_DRIVER"

      - name: Assert required check names match branch-protection script
        run: node scripts/ops/verify-required-check-names.mjs

      - name: Guard migration head constant matches tip folder (MR-P0-003)
        run: pnpm --filter @apps/api run guard:migration-head-preflight


      - name: Bootstrap app_tour role
        run: psql "$DATABASE_URL_ADMIN" -f docs/phase-4/dev/init/01-app-role.sql

      - name: Prisma migrate deploy
        run: DATABASE_URL="$DATABASE_URL_ADMIN" pnpm --filter @apps/api run db:migrate:deploy

      - name: Generate Prisma client
        run: pnpm --filter @apps/api run prisma:generate

      - name: Build Booking contract packages
        run: |
          bash scripts/ci/build-api-workspace-deps.sh

      - name: Touch optional env files for node --env-file
        run: |
          touch apps/api/.env apps/api/.env.local

      - name: test:booking-capacity-postgres
        working-directory: apps/api
        env:
          TENANT_MAX_CONCURRENT_DB_OPS: "32"
          PRISMA_TRANSACTION_TIMEOUT_MS: "60000"
          PRISMA_TRANSACTION_MAX_WAIT_MS: "30000"
        run: pnpm run test:booking-capacity-postgres

      - name: test:booking-approve-concurrency
        working-directory: apps/api
        env:
          TENANT_MAX_CONCURRENT_DB_OPS: "32"
        run: pnpm run test:booking-approve-concurrency

      - name: test:booking-capacity-stress
        working-directory: apps/api
        env:
          TENANT_MAX_CONCURRENT_DB_OPS: "64"
          PRISMA_TRANSACTION_TIMEOUT_MS: "120000"
          PRISMA_TRANSACTION_MAX_WAIT_MS: "60000"
        run: pnpm run test:booking-capacity-stress

  # Same check context as booking-postgres-capacity — success stub when PR paths are unrelated.
  booking-postgres-capacity-stub:
    name: Booking PostgreSQL capacity
    needs: booking-relevance
    if: needs.booking-relevance.outputs.run_booking != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip unrelated PR
        run: |
          echo "Skipping Booking PostgreSQL capacity — no booking-related paths in this PR."
          echo "push to main and workflow_dispatch always run the full job."

  booking-http-postgres:
    name: Booking HTTP PostgreSQL
    needs: booking-relevance
    if: needs.booking-relevance.outputs.run_booking == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tour_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tour_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Verify Node.js engine
        run: node scripts/guards/check-node-engine.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install CI OS packages
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Assert Prisma certification driver
        run: |
          test "$STORAGE_DRIVER" = "prisma"
          echo "STORAGE_DRIVER=$STORAGE_DRIVER"

      - name: Assert required check names match branch-protection script
        run: node scripts/ops/verify-required-check-names.mjs

      - name: Guard migration head constant matches tip folder (MR-P0-003)
        run: pnpm --filter @apps/api run guard:migration-head-preflight


      - name: Bootstrap app_tour role
        run: psql "$DATABASE_URL_ADMIN" -f docs/phase-4/dev/init/01-app-role.sql

      - name: Prisma migrate deploy
        run: DATABASE_URL="$DATABASE_URL_ADMIN" pnpm --filter @apps/api run db:migrate:deploy

      - name: Generate Prisma client
        run: pnpm --filter @apps/api run prisma:generate

      - name: Build runtime packages for createRequestListener
        run: |
          bash scripts/ci/build-api-workspace-deps.sh

      - name: Touch optional env files for node --env-file
        run: |
          touch apps/api/.env apps/api/.env.local

      - name: test:booking-http-postgres
        working-directory: apps/api
        env:
          TENANT_MAX_CONCURRENT_DB_OPS: "32"
          PRISMA_TRANSACTION_TIMEOUT_MS: "60000"
          PRISMA_TRANSACTION_MAX_WAIT_MS: "30000"
        run: pnpm run test:booking-http-postgres

      - name: test:booking-http-postgres-jwt-production (TODO-001)
        working-directory: apps/api
        env:
          TENANT_MAX_CONCURRENT_DB_OPS: "32"
          PRISMA_TRANSACTION_TIMEOUT_MS: "60000"
          PRISMA_TRANSACTION_MAX_WAIT_MS: "30000"
        run: pnpm run test:booking-http-postgres-jwt-production

      - name: test:booking-guest-duplicate-http-race (TODO-007)
        working-directory: apps/api
        env:
          TENANT_MAX_CONCURRENT_DB_OPS: "32"
          PRISMA_TRANSACTION_TIMEOUT_MS: "60000"
          PRISMA_TRANSACTION_MAX_WAIT_MS: "30000"
        run: pnpm run test:booking-guest-duplicate-http-race

      - name: test:booking-approve-outbox-relay-effect (TODO-006)
        working-directory: apps/api
        env:
          TENANT_MAX_CONCURRENT_DB_OPS: "32"
          PRISMA_TRANSACTION_TIMEOUT_MS: "60000"
          PRISMA_TRANSACTION_MAX_WAIT_MS: "30000"
        run: pnpm run test:booking-approve-outbox-relay-effect

      - name: test:tenant-rls-unprotected-tables (TODO-002)
        working-directory: apps/api
        env:
          TENANT_MAX_CONCURRENT_DB_OPS: "32"
        run: pnpm run test:tenant-rls-unprotected-tables

      - name: Branch protection script fail-closed contract (TODO-005)
        working-directory: apps/api
        run: pnpm run test:file -- src/ops/branch-protection-verify-fail-closed.spec.ts

      - name: Verify live main branch protection (TODO-005)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! pnpm run ops:branch-protection:verify; then
            echo "::error::main branch protection missing required Booking/Phase checks — run: pnpm run ops:branch-protection:main"
            exit 1
          fi

      - name: test:finance-recon-rls (MR-P0-005)
        working-directory: apps/api
        env:
          TENANT_MAX_CONCURRENT_DB_OPS: "32"
        run: pnpm run test:finance-recon-rls

  # Same check context as booking-http-postgres — success stub when PR paths are unrelated.
  booking-http-postgres-stub:
    name: Booking HTTP PostgreSQL
    needs: booking-relevance
    if: needs.booking-relevance.outputs.run_booking != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip unrelated PR
        run: |
          echo "Skipping Booking HTTP PostgreSQL — no booking-related paths in this PR."
          echo "push to main and workflow_dispatch always run the full job."
