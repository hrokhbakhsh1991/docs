# Finance-core boundary — path-filtered PR gate (Phase 2.2.3 / 2.3).
# Fails CI if packages/finance-core imports Prisma / apps/api / workspaces / generated / DB infra.
# Also runs package portability guard (standalone tsconfig / allowlisted deps).
# Does NOT run full monorepo build or phase gates.
#
# Authority: docs/phase-20/p7/appendices/FINANCE_PLATFORM_EVOLUTION_PLAN.md Phase 2.3

name: finance-core-boundary

on:
  push:
    branches:
      - main
    paths:
      - "packages/finance-core/**"
      - "packages/finance-http-contracts/**"
      - "scripts/guards/guard-finance-core-boundary.mjs"
      - "scripts/guards/guard-finance-golden-architecture.mjs"
      - "dependency-cruiser.config.js"
      - ".github/workflows/finance-core-boundary.yml"
  pull_request:
    paths:
      - "packages/finance-core/**"
      - "packages/finance-http-contracts/**"
      - "scripts/guards/guard-finance-core-boundary.mjs"
      - "scripts/guards/guard-finance-golden-architecture.mjs"
      - "dependency-cruiser.config.js"
      - ".github/workflows/finance-core-boundary.yml"
  workflow_dispatch:

concurrency:
  group: finance-core-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finance-core-boundary:
    name: Finance-core boundary (guard + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Verify Node.js engine
        run: node scripts/guards/check-node-engine.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build finance-http-contracts (finance-core dependency only)
        run: pnpm --filter @app-tour/finance-http-contracts run build

      - name: Guard finance-core boundary
        run: pnpm run guard:finance-core-boundary

      - name: Guard finance golden architecture (G1–G7)
        run: pnpm run guard:finance-golden

      - name: Guard finance-core portability
        run: pnpm --filter @app-tour/finance-core run guard:portability

      - name: Build finance-core
        run: pnpm --filter @app-tour/finance-core run build

      - name: Test finance-core
        run: pnpm --filter @app-tour/finance-core run test
