# Phase 10 — Workspace host invariants (fast; no full gate chain).
# Authority: docs/phase-10/phase-10-charter.md

name: phase-10-guard

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "packages/workspaces/**"
      - "packages/workspace-sdk/**"
      - "apps/api/src/workspace/**"
      - "apps/api/src/outbox/**"
      - "apps/api/src/app.ts"
      - "apps/api/src/boot/**"
      - "apps/api/src/http/**"
      - "apps/web/src/bootstrap/workspace-plugin-loaders.generated.ts"
      - "scripts/generate-workspace-registry.mjs"
      - "scripts/codegen/workspace-registry/**"
      - "scripts/member-portal-contract-codegen.mjs"
      - "scripts/guards/guard-workspace-certification.mjs"
      - "scripts/guards/lib/workspace-certification-guard.mjs"
      - "scripts/test/workspace-certification-guard.spec.mjs"
      - "docs/dev/workspace-certification.mdoc"
      - "docs/dev/workspace-certification-proof-matrix.yaml"
      - "scripts/test/workspace-registry-drop-in.spec.mjs"
      - "packages/workspace-sdk/src/catalog/workspace-production-certification.generated.ts"
      - "scripts/workspace-create.mjs"
      - "scripts/guards/phase-10-guard.mjs"
      - "scripts/guards/guard-guest-plugin-conformance.mjs"
      - "scripts/guards/guard-guest-*.mjs"
      - "scripts/guards/guard-intake-plugin-registry.mjs"
      - "scripts/guards/guard-no-default-fallback.mjs"
      - "scripts/guards/guard-generated-banner.mjs"
      - "scripts/guards/guard-feature-flag-boundary.mjs"
      - "scripts/guards/guard-structured-errors.mjs"
      - "scripts/guards/guard-guest-api-shell.mjs"
      - "scripts/test/workspace-guest-conformance.spec.mjs"
      - "scripts/test/workspace-create-guest.spec.mjs"
      - "scripts/test/test-extract-catalog-paths.mjs"
      - "docs/dev/guest-plugin-conformance.md"
      - "docs/dev/workspace-guest-extensions.schema.json"
      - "docs/dev/guest-registration-e2e-hooks.yaml"
      - "docs/dev/adr-guest-plugin/**"
      - "docs/phase-10/**"
      - ".github/workflows/phase-10-guard.yml"
  workflow_dispatch:

jobs:
  phase-10-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run phase-10:guard
      - run: pnpm run guard:guest-plugin-conformance
      - run: node --test scripts/test/workspace-registry-drop-in.spec.mjs
      - run: node --test scripts/test/workspace-production-certification.spec.mjs
      - run: pnpm run guard:workspace-certification
      - run: node --test scripts/test/workspace-certification-guard.spec.mjs
