name: PROD-3 release gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: prod-3-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Production readiness L3 release gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STORAGE_DRIVER: memory
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup platform toolchain
        uses: ./.github/actions/setup-platform
      - name: Build workspace dist surfaces for gates
        run: bash scripts/ci/build-api-workspace-deps.sh
      - name: Generate Prisma client for API tests
        run: pnpm --filter @apps/api run prisma:generate
      - name: Run catalog L3 gate
        run: pnpm run release:verify
      - name: Upload structured gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-3-l3-gate-report
          path: .artifacts/gates/
          if-no-files-found: error
