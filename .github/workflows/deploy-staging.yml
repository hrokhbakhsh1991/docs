name: Deploy staging (dev)

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "Open PR targeting dev; required for the Denali QA branch dispatch"
        required: false
        type: number

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: false

env:
  STAGING_DEPLOY_ROOT: /opt/app-tour-staging
  STAGING_ENV_DIR: /etc/app-tour-staging

jobs:
  build:
    name: Build and verify immutable staging artifact
    if: >-
      github.repository == 'hrokhbakhsh1991/docs' &&
      (github.ref == 'refs/heads/dev' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/denali-final-approval-e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.manifest.outputs.artifact }}
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate manually selected PR branch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/dev'
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pull_request_number }}
          STAGING_READ_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const fail = (message) => {
            console.error(`staging-dispatch: ${message}`);
            process.exit(1);
          };
          const number = Number(process.env.PR_NUMBER);
          if (!Number.isSafeInteger(number) || number <= 0) {
            fail('A valid open PR number is required for this staging dispatch.');
          }
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.STAGING_READ_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
          };
          const getJson = async (path) => {
            const response = await fetch(`https://api.github.com${path}`, { headers });
            if (!response.ok) fail(`GitHub API returned ${response.status}.`);
            return response.json();
          };
          const pr = await getJson(`/repos/${owner}/${repo}/pulls/${number}`);
          const expectedBranch = process.env.GITHUB_REF.replace('refs/heads/', '');
          if (
            pr.state !== 'open' ||
            pr.base.ref !== 'dev' ||
            pr.base.repo?.full_name !== process.env.GITHUB_REPOSITORY ||
            pr.head.repo?.full_name !== process.env.GITHUB_REPOSITORY ||
            pr.head.ref !== expectedBranch ||
            pr.head.sha !== process.env.GITHUB_SHA
          ) {
            fail('Dispatch must use the exact head SHA of an open same-repository PR targeting dev.');
          }
          const checks = await getJson(
            `/repos/${owner}/${repo}/commits/${process.env.GITHUB_SHA}/check-runs?per_page=100`
          );
          const requiredChecks = [
            'Deployment contract gate',
            'Booking HTTP PostgreSQL',
            'Booking PostgreSQL capacity',
          ];
          const missingOrFailed = requiredChecks.filter((name) => {
            const check = checks.check_runs
              .filter((candidate) => candidate.name === name)
              .sort(
                (left, right) =>
                  Date.parse(right.started_at ?? right.created_at) -
                  Date.parse(left.started_at ?? left.created_at)
              )[0];
            return !check || check.status !== 'completed' || check.conclusion !== 'success';
          });
          if (missingOrFailed.length > 0) {
            fail(
              `Exact-PR-head staging preflight must pass: ${missingOrFailed.join(', ')}.`
            );
          }
          console.log(
            `Validated staging candidate PR #${number} at ${process.env.GITHUB_SHA}; required preflight checks passed.`
          );
          NODE
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate API Prisma client
        run: pnpm --filter @apps/api run prisma:generate
      - name: Build workspace dependency artifacts
        run: |
          set -euo pipefail
          echo '::group::build-api-workspace-deps'
          timeout --signal=TERM --kill-after=30s 10m bash scripts/ci/build-api-workspace-deps.sh
          echo '::endgroup::'
      - name: Payment hold scheduler and expiry focused tests
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 5m bash -c 'cd apps/api && NODE_ENV=test STORAGE_DRIVER=memory node --import tsx --test --test-force-exit test/dp1/payment-hold-scheduler.spec.ts test/dp1/payment-hold-runtime-diagnostics.spec.ts test/dp1/payment-hold-expiry.spec.ts test/dp1/payment-hold-expiry-idempotency.spec.ts test/dp1/payment-hold-waitlist.spec.ts'
      - name: Wallet and API focused tests
        run: |
          set -euo pipefail
          echo '::group::wallet-staging-deploy-guards'
          timeout --signal=TERM --kill-after=30s 5m pnpm run test:wallet-staging-deploy-guards
          echo '::endgroup::'
          echo '::group::workspace-sdk-wallet-contracts'
          timeout --signal=TERM --kill-after=30s 10m bash -c 'cd packages/workspace-sdk && NODE_ENV=test node --import ./test/register-server-only-stub.mjs --import tsx --test test/wallet-contract-boundary.spec.ts test/wallet-module-enabled.spec.ts'
          echo '::endgroup::'
      - name: Workspace SDK focused tests
        run: |
          set -euo pipefail
          echo '::group::workspace-sdk-foundation'
          timeout --signal=TERM --kill-after=30s 10m bash -c 'cd packages/workspace-sdk && NODE_ENV=test node --import ./test/register-server-only-stub.mjs --import tsx --test test/foundation-import-purity.contract.spec.ts test/denali-coupling.contract.spec.ts'
          echo '::endgroup::'
      - name: Other changed tests
        run: |
          set -euo pipefail
          echo '::group::deployment-contracts'
          timeout --signal=TERM --kill-after=30s 5m node --test scripts/test/deployment-branch-contract.spec.mjs scripts/test/staging-ci-build-order.spec.mjs
          echo '::endgroup::'
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Build
        run: pnpm run build
      - name: Prove clean artifact checkout
        shell: bash
        run: |
          set -euo pipefail
          generated_report="docs/phase-19/architecture-truth-drift-report.json"
          changed="$(git diff --name-only)"
          untracked="$(git ls-files --others --exclude-standard)"
          if [[ -n "$untracked" || ( -n "$changed" && "$changed" != "$generated_report" ) ]]; then
            echo "Unexpected build changes before artifact packaging:" >&2
            git diff --name-status >&2
            [[ -z "$untracked" ]] || printf '?? %s\n' "$untracked" >&2
            exit 1
          fi
          if [[ "$changed" == "$generated_report" ]]; then
            git restore --worktree -- "$generated_report"
          fi
          test -z "$(git status --porcelain)"
      - name: Build staging artifact on runner
        run: bash scripts/vps-deploy/build-staging-artifact.sh
      - name: Verify release SHA and artifact digest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          artifact="dist/staging-artifacts/app-tour-staging-${GITHUB_SHA}.tar.zst"
          digest_file="${artifact}.sha256"
          test -f "$artifact" && test -f "$digest_file"
          actual_digest="$(awk '{print $1}' "$digest_file")"
          test "${#actual_digest}" -eq 64
          test "$(tar -I zstd -xOf "$artifact" "app-tour-staging-${GITHUB_SHA}/release-manifest.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).releaseSha))')" = "$GITHUB_SHA"
          echo "artifact=$(basename "$artifact")" >> "$GITHUB_OUTPUT"
          echo "digest=$actual_digest" >> "$GITHUB_OUTPUT"
      - name: Upload immutable artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-${{ github.sha }}-${{ steps.manifest.outputs.digest }}
          path: |
            dist/staging-artifacts/${{ steps.manifest.outputs.artifact }}
            dist/staging-artifacts/${{ steps.manifest.outputs.artifact }}.sha256
            dist/staging-artifacts/${{ steps.manifest.outputs.artifact }}.manifest.json
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy and verify staging
    needs: build
    if: >-
      github.repository == 'hrokhbakhsh1991/docs' &&
      (github.ref == 'refs/heads/dev' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/denali-final-approval-e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: staging-${{ github.sha }}-${{ needs.build.outputs.digest }}
          path: dist/staging-artifacts/downloaded
      - name: Require staging secrets and paths
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ vars.VPS_USER }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo "Missing staging secret VPS_HOST"; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo "Missing staging secret VPS_SSH_KEY"; exit 1; }
          test "${STAGING_DEPLOY_ROOT}" = "/opt/app-tour-staging"
          test "${STAGING_ENV_DIR}" = "/etc/app-tour-staging"
          if [[ "${GITHUB_REF}" != "refs/heads/dev" ]]; then
            test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
            [[ "${GITHUB_REF}" == "refs/heads/codex/denali-final-approval-e2e" ]]
            [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          fi
          test -z "${PRODUCTION_TARGET:-}" || { echo "Production target rejected"; exit 1; }
      - name: Verify downloaded artifact
        run: |
          set -euo pipefail
          download_root="dist/staging-artifacts/downloaded"
          mapfile -t artifacts < <(find "$download_root" -type f -name 'app-tour-staging-*.tar.zst' -print)
          test "${#artifacts[@]}" -eq 1 || {
            echo "Expected exactly one downloaded staging artifact" >&2
            find "$download_root" -maxdepth 3 -type f -print >&2
            exit 1
          }
          artifact="${artifacts[0]}"
          digest_file="${artifact}.sha256"
          test -f "$digest_file"
          (
            cd "$(dirname "$artifact")"
            sha256sum -c "$(basename "$digest_file")"
          )
          release_sha="$(tar -I zstd -xOf "$artifact" "app-tour-staging-${GITHUB_SHA}/release-manifest.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).releaseSha))')"
          test "$release_sha" = "$GITHUB_SHA"
          case "$(basename "$artifact")" in
            "app-tour-staging-${release_sha}.tar.zst") ;;
            *) echo "Artifact filename release SHA mismatch" >&2; exit 1 ;;
          esac
          printf 'STAGING_ARTIFACT=%s\n' "$artifact" >> "$GITHUB_ENV"
      - name: Configure SSH without printing secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/staging-key"
          chmod 600 "$HOME/.ssh/staging-key"
          echo "STAGING_SSH_KEY_FILE=$HOME/.ssh/staging-key" >> "$GITHUB_ENV"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null; then
              break
            fi
            echo "ssh-keyscan attempt ${attempt}/5 failed; retrying..."
            sleep $((attempt * 3))
          done
          # staging_ssh_cmd tolerates keyscan flake via staging-ssh.sh (see vps-deploy lib).
          ssh-keyscan -T 15 -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
      - name: Transfer, install, migrate, and standard seed
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_ROOT: ${{ env.STAGING_DEPLOY_ROOT }}
          ENV_DIR: ${{ env.STAGING_ENV_DIR }}
          STAGING_ARTIFACT_CHUNK_SIZE: 4m
          STAGING_SSH_RETRY_MAX: 8
          STAGING_SSH_CONTROL_DIR: /tmp/app-tour-staging-ssh
        run: ARTIFACT="$STAGING_ARTIFACT" bash scripts/vps-deploy/deploy-staging-artifact-remote.sh
      - name: Staging four-process health smoke
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_DEPLOY_PATH: ${{ env.STAGING_DEPLOY_ROOT }}/tooling
          ENV_DIR: ${{ env.STAGING_ENV_DIR }}
          UNIT_PREFIX: app-tour-staging
        run: bash scripts/p10-staging-remote-gate.sh
      - name: Staging app-role RLS catalog verification
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          ENV_DIR: ${{ env.STAGING_ENV_DIR }}
        run: bash scripts/vps-deploy/verify-staging-rls-remote.sh
      - name: Run workspace staging adapter
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          STAGING_ADAPTER_PATH: ${{ vars.STAGING_ADAPTER_PATH }}
          STAGING_ARTIFACT_DIGEST: ${{ needs.build.outputs.digest }}
          STAGING_RELEASE_SHA: ${{ github.sha }}
          STAGING_TENANT_SCOPE: pilot-only
          STAGING_DEPLOY_ROOT: ${{ env.STAGING_DEPLOY_ROOT }}
          STAGING_ENV_DIR: ${{ env.STAGING_ENV_DIR }}
          DEPLOY_TARGET: staging
          STAGING_DISPATCH_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test -n "$STAGING_ADAPTER_PATH" || { echo "Missing staging adapter path"; exit 1; }
          case "$STAGING_ADAPTER_PATH" in scripts/ci/*) ;; *) echo "Adapter must be repository-local"; exit 1 ;; esac
          test -x "$STAGING_ADAPTER_PATH" || { echo "Staging adapter is not executable: $STAGING_ADAPTER_PATH"; exit 1; }
          "$STAGING_ADAPTER_PATH" verify-staging
