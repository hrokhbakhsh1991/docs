# Finance golden architecture — fail-build forever invariants (G1–G7).
#
# Authority: docs/phase-20/p7/appendices/FINANCE_GOLDEN_ARCHITECTURE_TESTS.md
#
# S4 Stage B (DISABLED for automatic CI):
#   push/pull_request triggers removed so this file no longer emits duplicate
#   check names alongside finance-integrity.yml.
#   File preserved (not deleted). Manual workflow_dispatch retained for rollback
#   verification. Canonical automatic gate: .github/workflows/finance-integrity.yml
#   See docs/platform/FINANCE_CI_MIGRATION_STATUS.md

name: finance-golden-architecture

on:
  # Automatic PR/push disabled (S4 Stage B). Restore push+pull_request path filters
  # from git history to roll back dual-run. Manual run only:
  workflow_dispatch:

concurrency:
  group: finance-golden-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finance-golden:
    name: Finance golden architecture (G1–G7)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Verify Node.js engine
        run: node scripts/guards/check-node-engine.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Golden architecture guard (fail-build)
        run: pnpm run guard:finance-golden

      - name: Golden architecture node:test mirror
        run: pnpm --filter @apps/api exec node --import tsx --test src/workspace-finance/finance-golden-architecture.spec.ts
