# Docs-as-Code Doc-Gate (MIGRATION-MAP §19).
# Required before Phase 3.1 code merge; runs documentation-sync + Markdoc + audit-boundary.

name: doc-gate

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "docs/**"
      - "packages/workspace-sdk/**"
      - "packages/platform-core/**"
      - "apps/api/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/guard-docs.sh"
      - "scripts/guards/doc-gate.mjs"
      - "scripts/guards/documentation-sync.mjs"
      - "scripts/doc/**"
      - ".github/workflows/doc-gate.yml"

concurrency:
  group: doc-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doc-gate:
    name: Documentation Doc-Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup platform toolchain
        uses: ./.github/actions/setup-platform
        with:
          node-version: "24"
          engine-check-enabled: "false"

      - name: Install ripgrep (audit-boundary)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Doc-Gate
        run: pnpm run doc-gate
