# Phase 2.5 — design-tokens, ui-primitives, theme-react (phase-2:gate).

name: phase-2-gate

on:
  workflow_dispatch:

concurrency:
  group: phase-2-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Phase 2 design-system gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      STORAGE_DRIVER: memory
      NODE_ENV: test
      COLD_START_WORKER_READY_BUDGET_MS: "4000"
      COLD_START_HTTP_BUDGET_MS: "4000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup platform toolchain
        uses: ./.github/actions/setup-platform
        with:
          engine-check-enabled: "false"

      - name: Install ripgrep (audit-boundary)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Phase 2 gate
        run: pnpm run phase-2:gate

      - name: Upload phase-2 gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-gate-report
          path: reports/phase-2-gate-*.json
          if-no-files-found: ignore
