# Phase 3.5 — apps/api+web, starter, CASL, canonical SoT (phase-3:gate).

name: phase-3-gate

on:
  workflow_dispatch:

concurrency:
  group: phase-3-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Phase 3 platform gate
    runs-on: ubuntu-latest
    timeout-minutes: 55

    env:
      STORAGE_DRIVER: memory
      NODE_ENV: test
      COLD_START_WORKER_READY_BUDGET_MS: "4000"
      COLD_START_HTTP_BUDGET_MS: "4000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup platform toolchain
        uses: ./.github/actions/setup-platform

      - name: Install ripgrep (doc-gate audit-boundary)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Phase 3 gate
        run: pnpm run phase-3:gate

      - name: Upload phase-3 gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3-gate-report
          path: reports/phase-3-gate-*.json
          if-no-files-found: ignore
