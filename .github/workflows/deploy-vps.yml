name: Deploy VPS (operator stack)

# MR-P0-004: deploy only after MAIN_BRANCH_REQUIRED_CHECKS succeed on this SHA.
# Live branch protection still requires: pnpm run ops:branch-protection:main (gh auth).

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps-production
  # Mid-flight cancel is forbidden for production deploys (also MR-P0-013).
  cancel-in-progress: false

jobs:
  require-release-checks:
    name: Require release checks
    runs-on: ubuntu-latest
    # Required gates can legitimately run for up to 120 minutes (PROD-3 L3).
    # Keep the waiter slightly longer so it observes the terminal gate result
    # instead of failing first and skipping the deploy job.
    timeout-minutes: 130
    if: github.repository == 'hrokhbakhsh1991/docs'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Wait for Phase 0/1 + Booking PostgreSQL required checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          WAIT_CHECKS_TIMEOUT_SEC: "7500"
          WAIT_CHECKS_POLL_SEC: "30"
        run: node scripts/ops/wait-for-required-checks.mjs

  deploy:
    name: Deploy to VPS
    needs: [require-release-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'hrokhbakhsh1991/docs' && github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail closed outside main
        run: |
          test "${GITHUB_REF}" = "refs/heads/main" || {
            echo "Production deployment is restricted to refs/heads/main."
            exit 1
          }

      - name: Require VPS deploy secrets (no silent skip)
        id: vps
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "ERROR: VPS_HOST and VPS_SSH_KEY secrets are required for deploy (MR-P0-004/013)."
            echo "Configure repository secrets or do not run this workflow."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_HOST" || (echo "Missing secret VPS_HOST" && exit 1)
          test -n "$VPS_SSH_KEY" || (echo "Missing secret VPS_SSH_KEY" && exit 1)
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Verify SSH key fingerprint
        run: |
          ssh-keygen -y -f ~/.ssh/id_ed25519 | ssh-keygen -lf -

      - name: Run remote deploy
        # Production VPS currently keeps the checkout at /opt/app-tour.  Prefer
        # the durable enter helper when installed, but retain a direct-path
        # fallback so a missing optional helper cannot block an otherwise valid
        # deployment.
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          USER="${VPS_USER:-root}"
          PATH_ON_SERVER="${DEPLOY_PATH:-/opt/app-tour}"
          case "$PATH_ON_SERVER" in
            /opt/app-tour|/opt/app-tour/*|/srv/app-tour|/srv/app-tour/*) ;;
            *) echo "Production deployment path rejected: $PATH_ON_SERVER"; exit 1 ;;
          esac
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${USER}@${VPS_HOST}" \
            "set -euo pipefail
             if [[ -x /usr/local/sbin/app-tour-enter-deploy ]]; then
               DEPLOY_PATH='${PATH_ON_SERVER}' /usr/local/sbin/app-tour-enter-deploy
             elif [[ -x /usr/local/sbin/app-tour-ensure-bind ]]; then
               /usr/local/sbin/app-tour-ensure-bind
               DEPLOY_PATH='/srv/app-tour' bash /srv/app-tour/scripts/vps-deploy/remote-deploy.sh
             else
               DEPLOY_PATH='${PATH_ON_SERVER}' bash '${PATH_ON_SERVER}/scripts/vps-deploy/remote-deploy.sh'
             fi"

      - name: Post-deploy four-process smoke
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_DEPLOY_PATH: /opt/app-tour
          ENV_DIR: /etc/app-tour
          UNIT_PREFIX: app-tour
        run: bash scripts/p10-production-remote-gate.sh
