name: Deploy VPS (immutable RC)

# PROD-8 R8-07..R8-10 — production deploy only via approved RC/tag + environment approval.
# Legacy git-pull+build path remains in remote-deploy.sh for manual recovery only.

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "RC tag or SHA (e.g. rc-2026-08-23 or full git SHA)"
        required: true
        type: string
      release_tarball_url:
        description: "Optional pre-built prod8-release tarball URL (artifact download)"
        required: false
        type: string

concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Resolve immutable release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      git_sha: ${{ steps.resolve.outputs.git_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate RC tag policy
        run: node scripts/ops/prod8-validate-rc-ref.mjs "${{ github.event.inputs.release_ref }}"

      - name: Resolve release ref to SHA
        id: resolve
        run: |
          REF="${{ github.event.inputs.release_ref }}"
          SHA="$(node scripts/ops/prod8-validate-rc-ref.mjs "$REF" --print-sha)"
          echo "git_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved $REF -> $SHA"

  l3-eligibility:
    name: L3 release eligibility
    needs: [resolve-release]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.git_sha }}
          fetch-depth: 0

      - name: Setup platform
        uses: ./.github/actions/setup-platform

      - name: Run L3 gate on release SHA
        run: pnpm run release:verify

      - name: Build immutable bundle evidence
        run: pnpm run prod8:immutable-bundle

      - name: Upload PROD-8 artifact evidence
        uses: actions/upload-artifact@v4
        with:
          name: prod-8-release-evidence-${{ needs.resolve-release.outputs.git_sha }}
          path: .artifacts/prod8/
          if-no-files-found: error

  deploy:
    name: Deploy immutable release to VPS
    needs: [resolve-release, l3-eligibility]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    if: github.repository == 'hrokhbakhsh1991/docs'
    steps:
      - name: Checkout release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.git_sha }}
          fetch-depth: 0

      - name: Require VPS deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "ERROR: VPS_HOST and VPS_SSH_KEY secrets required for production deploy."
            exit 1
          fi

      - name: Setup platform
        uses: ./.github/actions/setup-platform

      - name: Package immutable release tarball
        run: |
          bash scripts/vps-deploy/package-immutable-release.sh "${{ needs.resolve-release.outputs.git_sha }}"

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Transfer and activate immutable release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          USER="${VPS_USER:-root}"
          SHA="${{ needs.resolve-release.outputs.git_sha }}"
          DEPLOY_ROOT="${VPS_DEPLOY_PATH:-/srv/app-tour}"
          if [ "$DEPLOY_ROOT" = "/opt/app-tour" ]; then DEPLOY_ROOT="/srv/app-tour"; fi
          TARBALL=".artifacts/prod8/prod8-release-${SHA}.tar.gz"
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes "$TARBALL" "${USER}@${VPS_HOST}:/tmp/prod8-release-${SHA}.tar.gz"
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes "${USER}@${VPS_HOST}" \
            "set -euo pipefail
             RELEASE_TARBALL=/tmp/prod8-release-${SHA}.tar.gz \
             RELEASE_SHA=${SHA} \
             DEPLOY_ROOT='${DEPLOY_ROOT}' \
             ENV_DIR=/etc/app-tour \
             UNIT_PREFIX=app-tour \
             bash -c 'mkdir -p \"\${DEPLOY_ROOT}/releases/\${RELEASE_SHA}\" && \
               tar -xzf \"\${RELEASE_TARBALL}\" -C \"\${DEPLOY_ROOT}/releases/\${RELEASE_SHA}\" && \
               RELEASE_TARBALL=\"\${RELEASE_TARBALL}\" RELEASE_SHA=\"\${RELEASE_SHA}\" \
               DEPLOY_ROOT=\"\${DEPLOY_ROOT}\" ENV_DIR=\"\${ENV_DIR}\" UNIT_PREFIX=\"\${UNIT_PREFIX}\" \
               bash \"\${DEPLOY_ROOT}/releases/\${RELEASE_SHA}/scripts/vps-deploy/deploy-immutable-release.sh\"'"

      - name: Post-deploy four-process smoke
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: /srv/app-tour
          ENV_DIR: /etc/app-tour
          UNIT_PREFIX: app-tour
        run: bash scripts/p10-production-remote-gate.sh
