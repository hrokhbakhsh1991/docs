services:
  postgres:
    image: postgres:16
    container_name: tours-e2e-postgres
    environment:
      POSTGRES_DB: tours_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
    ports:
      # Host 5434 avoids clashing with dev Postgres on 5432; set DB_PORT/DATABASE_PORT=5434 in .env.test when using this stack.
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d tours_test"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - postgres-e2e-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: tours-e2e-redis
    ports:
      # Host 6380 avoids clashing with dev Redis on 6379; set REDIS_PORT=6380 in .env.test when using this stack.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s

volumes:
  postgres-e2e-data:
