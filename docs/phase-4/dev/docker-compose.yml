# Phase 4 local Postgres — matches DATABASE_URL in docs/phase-4/ci.md dev profile
# Usage: docker compose -f docs/phase-4/dev/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16
    container_name: app-tour-phase4-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tour_db
    ports:
      - "${PHASE4_DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tour_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - phase4_postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro

volumes:
  phase4_postgres_data:
