# P8 — Sole AI boot manifest (T0 entry)
# Authority: AGENT-START.md · p8-app-fit.md

manifest_id: P8-BOOT-MANIFEST
pack_version: "1.0"
sole_entry: docs/phase-21/AGENT-START.md
fail_token: P8_FAIL
machine_snapshot: docs/phase-21/AGENT-CURRENT-PHASE.yaml
implementation_truth: appendices/P8-IMPLEMENTATION-TRUTH.md
anti_hollow: appendices/P8-ANTI-HOLLOW-CONTRACT.md
