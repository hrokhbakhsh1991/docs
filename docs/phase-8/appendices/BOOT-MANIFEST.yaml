# Phase 8 — Authoritative agent boot manifest (Product Parity PEK)
manifest_version: "2026-06-08-v1"
phase_id: "8"
phase_name: "Product Parity & Dynamic Core Hardening"
doc_execution_system_target: 96
sole_execution_entry: ../phase-8-agent-router.md
fail_token: FAIL
pek_reference: ../phase-8-charter.md
charter: ../phase-8-charter.md
implementation_truth: ../audits/IMPLEMENTATION-TRUTH.md
covenant: "../../MIGRATION-MAP.md#۱۲-the-zero-debt-covenant-mandatory-enforcement"
platform_dod: "../../MIGRATION-MAP.md#۲۲-definition-of-done--کل-پلتفرم"

# Epic selection (locked for Phase 8 doc pack)
epic:
  primary: "Option A — Product Parity"
  secondary: "Option E — Enterprise silo hardening (8.3 only)"

boot_sequence_T0:
  - id: boot-0
    read: ../audits/IMPLEMENTATION-TRUTH.md
  - id: boot-1
    read: ../phase-8-charter.md
  - id: boot-2
    read: ../../phase-7/audits/IMPLEMENTATION-TRUTH.md
    note: "Phase 7 closure honesty before Phase 8 claims"
  - id: boot-3
    read: ../../phase-7/appendices/LEGACY-URBAN-REFERENCE.md
  - id: boot-4
    read: ../../phase-7/appendices/URBAN-MINIMAL-SCOPE.md
  - id: boot-5
    read: ../../appendices/PLATFORM-CONTINUITY-0-7.md
  - id: boot-6
    assert: reading phase-8-agent-router.md
  - id: boot-6b
    read: ../AGENT-NAVIGATOR.md
    note: "Step 3 — what to read/do next (after router + truth)"
  - id: boot-6c
    read: AGENT-CURRENT-PHASE.yaml
    note: "Machine snapshot — sync with IMPLEMENTATION-TRUTH"
  - id: boot-7
    run: pnpm run phase-7:gate
    expect_exit: 0
    when_subphase_gte: "8.0"
  - id: boot-8
    algorithm: detect_current_subphase
  - id: boot-9
    load: subphases/{current_subphase}.md

repo_status_enum:
  - SPEC_ONLY
  - PARTIAL
  - VERIFIED_SCAFFOLD
  - VERIFIED_BEHAVIORAL
  - VERIFIED_ENTRY
  - READY_FOR_IMPLEMENTATION
  - BLOCKED
  - ABSENT
  - NOT_BOUND

# ─── Subphase dependency tree ───────────────────────────────────────────────

subphases:
  "8.0":
    title: Entry Gate
    spec: ../subphases/8.0-entry.md
    prerequisites: []
    blocks: ["8.1"]
    parallelizable: false
    primary_artifact: reports/phase-8-entry-verified.yaml
    prove_with:
      - pnpm run phase-7:gate
      - docs/MIGRATION-MAP.md §22 checklist reviewed
  "8.1":
    title: Single-Owner Auth & CASL Enforcement
    spec: ../subphases/8.1-single-owner-auth.md
    prerequisites: ["8.0"]
    blocks: ["8.2"]
    parallelizable: false
    primary_artifact: docs/phase-8/appendices/URBAN-ROUTE-MATRIX.md
    prove_with:
      - packages/workspaces/urban/test/urban-owner-ability.spec.ts
      - apps/api/test/urban-owner-ability.spec.ts
      - apps/api/test/urban-settings-patch.spec.ts
      - apps/api/test/urban-redis-fallback.spec.ts
      - apps/api/test/urban-tours-bypass-gate.spec.ts
      - apps/web/test/urban-owner-access.spec.ts
  "8.2":
    title: Urban Product Feature Port
    spec: ../subphases/8.2-urban-features.md
    prerequisites: ["8.1"]
    blocks: ["8.3", "8.4"]
    parallelizable: false
    primary_artifact: packages/workspaces/urban/
    prove_with:
      - pnpm --filter @app-tour/workspace-urban build
      - pnpm --filter @app-tour/workspace-urban test
      - apps/api/test/urban-catalog-registration.spec.ts
  "8.3":
    title: Silo Tier Integration
    spec: ../subphases/8.3-silo-tier.md
    prerequisites: ["8.2"]
    blocks: ["8.5"]
    parallelizable: true
    parallel_group: hardening
    primary_artifact: packages/tenant-kernel/
    prove_with:
      - TenantConnectionRouter enterprise fixture tests
      - infra/sql tenant_routes migration applied
  "8.4":
    title: E2E Integrity
    spec: ../subphases/8.4-e2e-integrity.md
    prerequisites: ["8.2"]
    blocks: ["8.5"]
    parallelizable: true
    parallel_group: product_proof
    primary_artifact: apps/web/tests/e2e/
    prove_with:
      - Playwright urban catalog → register → settings
      - HTTP integration catalog + registration paths
  "8.5":
    title: Product Parity DoD Gate
    spec: ../subphases/8.5-platform-dod.md
    prerequisites: ["8.1", "8.2", "8.3", "8.4"]
    blocks: []
    parallelizable: false
    primary_artifact: reports/phase-8-gate-*.json
    prove_with:
      - pnpm run phase-8:gate
      - phase-8.contract.spec.ts
      - FORENSIC-RUBRIC score >= 8

dependency_graph: |
  8.0 → 8.1 → 8.2 → {8.3 ∥ 8.4} → 8.5

parallel_groups:
  after_8_2: ["8.3", "8.4"]
  merge_8_5_requires: ["8.1", "8.2", "8.3", "8.4"]

detect_current_subphase:
  pick_rule: min_numeric_id_among_eligible
  doc_ready_subphase: "8.1 when IMPLEMENTATION-TRUTH subphase_8_1.status == READY_FOR_IMPLEMENTATION"
  behavioral_active_subphase: "detectCurrentSubphase() from ledger table statuses"
  steps:
    - "If 8.0 not VERIFIED_ENTRY|VERIFIED_BEHAVIORAL → behavioral = 8.0"
    - "If 8.1 not VERIFIED_BEHAVIORAL → behavioral = 8.1 (even when doc_ready = 8.1 READY_FOR_IMPLEMENTATION)"
    - "If 8.2 not VERIFIED_BEHAVIORAL → behavioral = 8.2"
    - "eligible_parallel = subset of {8.3, 8.4} not VERIFIED_BEHAVIORAL"
    - "If eligible_parallel non-empty → behavioral = min(id)"
    - "Else behavioral = 8.5"
  note: "doc_ready_subphase may lead behavioral_active_subphase — ERIP COP enforced on doc_ready ≥ 8.1"

transition_guards:
  TG-P8-001:
    blocks: "8.1"
    until: "reports/phase-8-entry-verified.yaml phase_7_gate.status == PASS"
  TG-P8-002:
    blocks: "8.2"
    until: "8.1 VERIFIED_BEHAVIORAL"
  TG-P8-003:
    blocks: ["8.3", "8.4"]
    until: "8.2 VERIFIED_BEHAVIORAL"
  TG-P8-004:
    blocks: "8.5"
    until: "merge_8_5_requires all VERIFIED_BEHAVIORAL"

