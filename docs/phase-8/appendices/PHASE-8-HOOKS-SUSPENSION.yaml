# Phase 8 — temporary Husky / pre-commit suspension (implementation velocity)
# Authority: operator decision 2026-06-08 · re-enable mandatory at subphase 8.5

suspension_id: PHASE-8-HOOKS-SUSPENSION
version: "2026-06-08-v1"
active: true
since: "2026-06-08"
until_subphase: "8.5"
until_gate: pnpm run phase-8:gate

scope:
  suspended:
    - .husky/pre-commit → scripts/pre-commit-fast.sh (entire fast path)
    - guard-docs
    - check-node-engine
    - eslint on diff
    - prettier on diff
    - test-changed (pre-commit mode)
  not_suspended:
    - manual CI (GitHub Actions on push — unchanged)
    - explicit local runs (pnpm run phase-8:guard, test:full, ci:integrity)

re_enable:
  delete_marker: docs/phase-8/appendices/PHASE-8-HOOKS-SUSPENSION.yaml
  verify:
    - pnpm run pre-commit:fast
    - pnpm run test:full
    - pnpm run phase-8:guard
    - pnpm run ci:integrity
  ledger: update docs/phase-8/audits/IMPLEMENTATION-TRUTH.md hooks row at 8.5

rationale: |
  Phase 8 trunk work (8.1→8.4) batches large cross-surface diffs. Full pre-commit
  (especially @apps/api test-changed) dominated commit latency. Documentation and
  boundary guards remain the source of truth; automated hook enforcement resumes
  once at 8.5 platform DoD closure.

forbidden:
  - HUSKY=0 or --no-verify as bypass (marker file is the only supported suspend path)
  - claiming phase-8:gate PASS while this file has active: true
