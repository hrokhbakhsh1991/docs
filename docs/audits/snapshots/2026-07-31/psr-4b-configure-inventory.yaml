program_id: PSR-001
wave: PSR-4b-configure
updated: "2026-07-31"
policy:
  # Product-named host configure files remaining after this wave (denali + urban×2).
  product_named_configure_ceiling: 3
  # All http/configure-*.ts must be listed here.
  exact_configure_set_required: true
  # Configure adapters must not use bare package `/http` subpaths (use ./host/http).
  forbid_bare_http_subpath_in_configure: true
  # Platform finance wiring is not a product-named adapter.
  finance_configure_must_be_platform_neutral: true
adapters:
  - path: apps/api/src/http/configure-finance-http-host.ts
    class: platform-neutral
    branded_imports: []
    wires: "@app-tour/finance-http"
    notes: "Renamed from configure-workspace-finance-http-host (PSR-4b-configure)"
  - path: apps/api/src/http/configure-workspace-denali-product-http-host.ts
    class: product-named
    branded_imports:
      - "@app-tour/workspace-denali/host/http"
    wires: configureDenaliProductHttpHost
    notes: "Import retargeted /http → /host/http; absorption deferred"
  - path: apps/api/src/http/configure-urban-http-host.ts
    class: product-named
    branded_imports:
      - "@app-tour/workspace-urban/host/http"
    wires: configureUrbanHttpHost
    notes: "Import retargeted /http → /host/http; absorption deferred"
  - path: apps/api/src/http/configure-urban-surface-exposure.ts
    class: product-named
    branded_imports:
      - "@app-tour/workspace-urban/exposure"
      - "@app-tour/workspace-sdk"
    wires: buildUrbanExposureResolverPort
    notes: "Folded from exposure/ in host-imports-3; absorption deferred"
metrics:
