parallel_groups:
  note: "Phase 9 operator rail is sequential 9.0→9.8 — no parallel subphases until 9.8 regression bundle"

detect_current_subphase:
  version: "2026-06-08-v2"
  doc_ready_subphase: "9.1"
  behavioral_active_subphase: "9.0"
  partial_subphases:
    - id: "9.7"
      status: PARTIAL_R1
  snapshot: ../appendices/AGENT-CURRENT-PHASE.yaml
  algorithm: |
    1. Read IMPLEMENTATION-TRUTH subphase ledger + implementation_mode block.
    2. Highest subphase with VERIFIED_BEHAVIORAL or PARTIAL_R1 on trunk → behavioral anchor.
    3. Next subphase in DAG → doc_ready if specs on disk and transition_guards allow.
    4. If phase_8_gate != PASS → cap doc_ready at 9.0 (TG-P9-001).
    5. Sync appendices/AGENT-CURRENT-PHASE.yaml with steps 1–4 after every doc PR.

transition_guards:
  TG-P9-001:
    blocks: ["9.1"]
    until: "phase_8_gate.status PASS in entry yaml"
  TG-P9-002:
    blocks: ["9.2"]
    until: "9.1 VERIFIED_BEHAVIORAL"
  TG-P9-003:
    blocks: ["9.3"]
    until: "9.2 VERIFIED_BEHAVIORAL"
  TG-P9-004:
    blocks: ["9.4", "9.5", "9.6", "9.7", "9.8"]
    until: "prior sequential subphase VERIFIED_BEHAVIORAL"
  TG-P9-005:
    blocks: "9.8"
    until: "9.1-9.7 all VERIFIED_BEHAVIORAL — 9.7 PARTIAL_R1 does not satisfy (R4 closure per DEC-P9-016 required)"

