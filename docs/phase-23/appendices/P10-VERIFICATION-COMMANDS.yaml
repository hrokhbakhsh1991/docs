# P10 — Verification commands (canonical — 16 nanos)
# Agents: load ONLY current_nano key

manifest_id: P10-VERIFICATION-COMMANDS
pack_version: "1.0"
nano_total: 16

P10-1-N-001:
  epic: P10-1
  gaps: [G-TLS-01, G-TLS-02, G-TLS-04, G-TLS-09]
  proof_tier: PROFILE_C
  repo_status: NOT_STARTED
  forbidden_until: []
  summary: Caddy wildcard staging TLS + reverse_proxy loopback 3000-3003
  commands:
    - run: test -f deploy/vps/caddy/Caddyfile
      expect_exit: 0
    - run: rg "reverse_proxy 127\\.0\\.0\\.1:\\{\\$(WEB|MARKETING|PORTAL)_PORT\\}" deploy/vps/caddy -S
      expect_exit: 0
    - run: rg "tls|wildcard|\\*\\." deploy/vps/caddy -i
      expect_exit: 0
    - run: pnpm run p10:gate
      expect_stdout: P10_PRODUCTION_GRADE_GATE_OK
  files_touch:
    - deploy/vps/caddy/
    - deploy/vps/README.md
  forbidden_shortcuts:
    - "Caddyfile doc only — no curl HTTPS on staging host"
    - "on_demand_tls before wildcard staging proven"
    - "Expose apps on 0.0.0.0:3000-3003 in Profile C mode"
    - "nginx-only without deploy/vps template in repo"

