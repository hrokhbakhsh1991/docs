    name: P0 Profile C foundation (wildcard staging first)
    when: First P10 sprint
    items:
      - id: A1
        gaps: [G-TLS-01, G-TLS-02, G-TLS-04, G-TLS-09]
        action: deploy/vps/caddy — wildcard *.staging.example.com · reverse_proxy loopback 3000-3003
        note: Profile B IP ports may stay until edge cutover — documented dual mode
        verify: curl -I https://operator.admin.staging.example.com/auth/login
        epic: P10-1-N-001

      - id: A2
        gaps: [G-DEP-01, G-DEP-09]
        action: health-check.sh + smoke-four-process.sh — all 4 units
        epic: P10-2-N-001

      - id: A3
        gaps: [G-DEP-02]
        action: GHA deploy-vps post-step or p10-staging-remote-gate.sh
        epic: P10-2-N-002

      - id: A4
        gaps: [G-OPS-01]
        action: runbooks/p10-incident-four-process.md
        epic: P10-3-N-001

  B:
    name: P1 production hardening
    when: P10 EPIC completion
    items:
      - id: B1
        gaps: [G-DEP-03]
        action: package.json build:operator-vps → build-operator-vps.sh
        epic: P10-2-N-003

      - id: B2
        gaps: [G-DEP-04, G-DEP-05]
        action: Profile C env regression — verify P8 G-ENV-01/02 closed; extend only if P8 deferred
        epic: P10-2-N-004

      - id: B3
        gaps: [G-DEP-06]
        action: p7-staging-verify M+P fail-closed
        epic: P10-2-N-005

      - id: B4
        gaps: [G-TLS-05, G-TLS-07]
        action: edge headers doc (loopback trust); SESSION_COOKIE_SECURE Profile C smoke
        epic: P10-1-N-002

      - id: B5
        gaps: [G-TLS-06, G-OPS-04]
        action: cert renewal runbook
        epic: P10-3-N-002

      - id: B6
        gaps: [G-DEP-10]
        action: rollback-vps.sh idempotent
        epic: P10-3-N-003

      - id: B7
        gaps: [G-DOM-02]
        action: M+P custom apex SSL path (after staging wildcard proven)
        epic: P10-0

  C:
    name: P2+ polish
    when: P10 tail
    items:
      - id: C1
        gaps: [G-TLS-03, G-TLS-10]
        action: on_demand_tls ask endpoint — verified tenant_domains only
        epic: P10-0-N-002

      - id: C2
        gaps: [G-DOM-04]
        action: second club runbook — platform subdomain (not production club required for exit)
        epic: P10-0-N-003

      - id: C3
        gaps: [G-DOM-05]
        action: custom domain HTTPS E2E (M+P apex)
        epic: P10-2-N-006

      - id: C4
        gaps: [G-DEP-08]
        action: deploy/vps/README Profile C + four-process first
        epic: P10-3-N-005

      - id: C5
        action: p10:gate + p10-pack-integrity.spec.ts
        epic: P10-3-N-006

      - id: C6
        gaps: [G-OPS-02]
        action: VPS DR drill script (lite) or signed waive
        epic: P10-3-N-004

