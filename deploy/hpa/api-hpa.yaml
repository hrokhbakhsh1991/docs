# DEC-122 — HPA for API Rollout: CPU + custom metrics (DEC-121 adapter).
# Prerequisites: prometheus-adapter rules, ServiceMonitor, Argo Rollouts controller.
# Apply: kubectl apply -f deploy/hpa/api-hpa.yaml -n app-tour
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: app-tour
  labels:
    app: api
    app.kubernetes.io/component: http-api
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: api
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Pods
      pods:
        metric:
          name: http_requests_in_flight
        target:
          type: AverageValue
          averageValue: "32"
    - type: Pods
      pods:
        metric:
          name: outbox_pending_total
        target:
          type: AverageValue
          averageValue: "100"
    - type: Pods
      pods:
        metric:
          name: outbox_relay_oldest_pending_age_seconds
        target:
          type: AverageValue
          averageValue: "120"
