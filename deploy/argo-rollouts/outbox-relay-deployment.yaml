# DEC-118 — Dedicated outbox relay worker (RB-GAP-14).
# Same image as API; WORKER_ROLE=outbox-relay boots relay + projection reconcile only.
# Apply: kubectl apply -f deploy/argo-rollouts/outbox-relay-deployment.yaml -n app-tour
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-relay
  namespace: app-tour
  labels:
    app: outbox-relay
    app.kubernetes.io/component: outbox-relay
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: outbox-relay
  template:
    metadata:
      labels:
        app: outbox-relay
        role: outbox-relay
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: outbox-relay
          image: ghcr.io/app-tour/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: WORKER_ROLE
              value: outbox-relay
            - name: OUTBOX_RELAY_ENABLED
              value: "true"
            - name: PORT
              value: "3001"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
