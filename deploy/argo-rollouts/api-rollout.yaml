# DEC-118 — API blue-green Rollout (relay disabled on API pods).
# Apply: kubectl apply -f deploy/argo-rollouts/api-rollout.yaml -n app-tour
---
apiVersion: v1
kind: Service
metadata:
  name: api-active
  namespace: app-tour
  labels:
    app: api
spec:
  selector:
    app: api
    rollouts-pod-template-hash: active-placeholder
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: api-preview
  namespace: app-tour
  labels:
    app: api
spec:
  selector:
    app: api
    rollouts-pod-template-hash: preview-placeholder
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api
  namespace: app-tour
  labels:
    app: api
    app.kubernetes.io/component: http-api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    blueGreen:
      activeService: api-active
      previewService: api-preview
      scaleDownDelaySeconds: 30
      autoPromotionEnabled: false
      prePromotionAnalysis:
        templates:
          - templateName: api-smoke
        args:
          - name: service-name
            value: api-preview
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        role: api
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: api
          image: ghcr.io/app-tour/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: WORKER_ROLE
              value: api
            - name: OUTBOX_RELAY_ENABLED
              value: "false"
            - name: PORT
              value: "3001"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
