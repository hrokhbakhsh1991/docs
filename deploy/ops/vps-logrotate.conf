# PROD-8 — VPS log rotation template for journald + app logs
# Install: cp deploy/ops/vps-logrotate.conf /etc/logrotate.d/app-tour

/var/log/app-tour/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 app-tour app-tour
    sharedscripts
    postrotate
        systemctl kill -s HUP app-tour-api.service 2>/dev/null || true
    endscript
}

/var/backups/app-cloud/*.dump {
    weekly
    rotate 8
    compress
    missingok
    notifempty
}
